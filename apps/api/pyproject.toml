[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "staylead-platform-api"
version = "0.1.0"
description = "StayLead modular monolith API skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
azure-openai = ["openai>=1.58,<3.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
